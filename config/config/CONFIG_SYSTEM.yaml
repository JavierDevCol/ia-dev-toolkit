# ============================================
# CONFIGURACIÓN DEL SISTEMA SAC
# ============================================
# ⚠️ NO MODIFICAR - Rutas internas del sistema
# SAC - Sistema Agéntico COCHAS
# ============================================

# ============================================
# CARPETAS PRINCIPALES
# ============================================
rutas:
  output_folder: "{project-root}/.SAC"
  artifacts_folder: "{project-root}/artifacts"
  config_folder: "{project-root}/.SAC/config"
  herramientas_folder: "{project-root}/.SAC/herramientas"
  agentes_folder: "{project-root}/.SAC/agentes"

# ============================================
# ARCHIVOS DEL SISTEMA
# ============================================
archivos:
  config_user: "{project-root}/.SAC/config/CONFIG_USER.yaml" 
  backlog: "{project-root}/artifacts/backlog_desarrollo.md"
  reglas_arquitectonicas: "{project-root}/artifacts/reglas_arquitectonicas.md"
  # Workspace unificado (mono y multi proyecto)
  workspace: "{project-root}/artifacts/workspace.md"

# ============================================
# SUBCARPETAS DE ARTIFACTS
# ============================================
artifacts:
  # Historias de Usuario (carpetas individuales)
  hu_folder: "{project-root}/artifacts/HU"
  # Arquitectura
  adr_folder: "{project-root}/artifacts/ADR"
  # Code quality
  code_smells_folder: "{project-root}/artifacts/code_smells"
  # Bugs y pendientes
  bugs_folder: "{project-root}/artifacts/bugs"  # DEPRECATED: nuevos bugs van en hu_folder/BUG-NNN/
  lecciones_aprendidas: "{project-root}/artifacts/lecciones_aprendidas.md"
  pendientes: "{project-root}/artifacts/pendientes.md"
  pendientes_folder: "{project-root}/artifacts/pendientes"
  # Deuda técnica
  deuda_tecnica_folder: "{project-root}/artifacts/deuda_tecnica"
  # Multi-proyecto
  contextos_folder: "{project-root}/artifacts/contextos"
  # ELIMINADO: hu_refinamientos (archivos en carpeta de HU)
  # ELIMINADO: hu_compartidas (usar tasks hijas)
  # ELIMINADO: planes_folder (archivos en carpeta de HU)
  # ELIMINADO: ejecuciones_folder (Tracking.md en carpeta de HU)

# ============================================
# CONFIGURACIÓN MULTI-PROYECTO
# ============================================
multi_proyecto:
  # Patrones para detectar raíz de proyecto
  marcadores_proyecto:
    java: ["pom.xml", "build.gradle", "build.gradle.kts"]
    javascript: ["package.json"]
    python: ["pyproject.toml", "setup.py", "requirements.txt"]
    dotnet: ["*.csproj", "*.sln"]
    rust: ["Cargo.toml"]
    go: ["go.mod"]
  # Nomenclatura de archivos generados
  patron_contexto: "contexto_proyecto_{nombre}.md"
  patron_stack: "stack_proyecto_{nombre}.md"
  patron_hu_proyecto: "HU/{nombre_proyecto}/"

# ============================================
# RUTAS DE REGLAS
# ============================================
rutas_reglas:
  reglas_folder: "{project-root}/.SAC/reglas"

# ============================================
# REGLAS DEL SISTEMA
# ============================================
reglas:
  # Solo reglas con valor único (no conocimiento implícito del LLM)
  mermaid: "{project-root}/.SAC/reglas/mermaid.rules.md"
  # ELIMINADOS - conocimiento implícito del LLM:
  # - deteccion_stack, java, javascript, python, dotnet, go, patrones_diseno
