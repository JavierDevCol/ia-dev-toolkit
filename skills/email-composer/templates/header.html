<div style="background-color:$header_color; padding:24px 28px; border-radius:6px 6px 0 0;">
    <p style="margin:0 0 6px; color:#ffffff; opacity:0.75; font-size:12px; letter-spacing:1px; text-transform:uppercase;">$kicker</p>
    <h1 style="margin:0; color:#ffffff; font-size:21px; font-weight:600; line-height:1.3;">$title</h1>
    <p style="margin:8px 0 0; color:#ffffff; opacity:0.85; font-size:13px;">$subtitle</p>
</div>
